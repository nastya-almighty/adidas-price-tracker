
name: Adidas Price Tracker

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Europe/Berlin"

  workflow_dispatch:
    inputs:
      send_test:
        description: "Send test Telegram message"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: adidas-price-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check Adidas price
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test || 'false' }}
        run: python check_price.py

      - name: Save previous price
        run: |
          if [ -f price_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add price_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Adidas price"
              git push
            fi
          fi
